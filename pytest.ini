[pytest]
addopts = -m "not real_repo_smoke and not high_value_smoke and not repo_scan_nightly"
markers =
    real_repo_smoke: thin CLI smoke tests that exercise tools against the real repository
    high_value_smoke: high-value integration smoke tests that touch production-adjacent paths
    repo_scan_nightly: expensive real-repo scan/report tests that are kept outside the daily suite
