<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ブロッククエスト - つながっていません</title>
<meta name="theme-color" content="#1a1466">
<style>
:root {
  --bg-deep: #1a1466;
  --bg-mid: #2a1f8c;
  --accent-yellow: #ffd23f;
  --accent-red: #ff5e5b;
  --text: #ffffff;
  --text-soft: #cfd6ff;
}
html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
  color: var(--text);
  font-family: 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif;
}
.box {
  max-width: 480px;
  margin: 0 auto;
  padding: 80px 24px;
  text-align: center;
}
h1 {
  font-size: 20px;
  color: var(--accent-yellow);
  text-shadow: 2px 2px 0 var(--accent-red);
  line-height: 1.6;
}
p { color: var(--text-soft); line-height: 1.9; }
a.btn {
  display: inline-block;
  margin-top: 24px;
  padding: 14px 28px;
  background: var(--accent-yellow);
  color: #1a1466;
  font-weight: bold;
  text-decoration: none;
  border-bottom: 4px solid #c89b1e;
}
</style>
</head>
<body>
<div class="box">
  <h1>いまは インターネットに<br>つながっていません</h1>
  <p>ブロッククエストで あそぶには<br>インターネットが ひつようです。<br>Wi-Fi を たしかめてから<br>もういちど ためしてね。</p>
  <a class="btn" href="./">もういちど ひらく</a>
</div>
</body>
</html>
